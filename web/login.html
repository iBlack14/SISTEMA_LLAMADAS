<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión · Gestión de llamadas VC</title>
  <link rel="stylesheet" href="/auth.css">
  <script type="module" src="/login.js"></script>
</head>
<body class="access-page">
  <main class="access-shell">
    <aside class="access-brand">
      <img src="/logo-vc-color.png" alt="ViaVox VC" width="180">
      <h1>Tu centro<br>de llamadas.</h1>
      <p>Accede para gestionar tus campañas y equipos Android.</p>
    </aside>
    <section class="access-form" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Iniciar sesión</h2>
      <p>Ingresa con tu cuenta de trabajo.</p>
      <form id="loginForm">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="80" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <p id="loginError" class="access-error" role="alert" aria-live="polite"></p>
        <button id="loginButton" type="submit">Ingresar</button>
      </form>
    </section>
  </main>
</body>
</html>
